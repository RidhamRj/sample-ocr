name: frontend compiler diagnostics

on:
  pull_request:

permissions:
  contents: read

jobs:
  capture-build-log:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Capture compiler output
        run: |
          set +e
          npm run build > frontend-build.log 2>&1
          echo $? > frontend-build.exit-code
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-compiler-log
          path: |
            frontend-build.log
            frontend-build.exit-code
