<!doctype html><html><head><meta charset="utf-8"><title>OpenCV benchmark</title></head><body><pre id="output">running</pre><script>
window.__BENCHMARK_RESULT__=null;
const names=["borderless-invoice","ruled-invoice","skewed-invoice"];
const median=(values)=>{const s=[...values].sort((a,b)=>a-b),m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2};
const countAccuracy=(a,b)=>a===b?1:Math.min(a,b)/Math.max(a,b,1);
const bounds=(box)=>{const xs=box.map(p=>p[0]),ys=box.map(p=>p[1]);return{x:Math.min(...xs),y:Math.min(...ys),width:Math.max(...xs)-Math.min(...xs),height:Math.max(...ys)-Math.min(...ys)}};
const cluster=(values,tolerance)=>{const groups=[];for(const value of [...values].sort((a,b)=>a-b)){const last=groups.at(-1);if(!last||value-last.at(-1)>tolerance)groups.push([value]);else last.push(value)}return groups.map(g=>g.reduce((s,v)=>s+v,0)/g.length)};
function borderless(ocr,width,height){if(ocr.length<9)return[];const boxes=ocr.map(i=>bounds(i.box)),heights=boxes.map(b=>b.height),widths=boxes.map(b=>b.width),rows=cluster(boxes.map(b=>b.y+b.height/2),Math.max(8,median(heights)*.75)),columns=cluster(boxes.map(b=>b.x+b.width/2),Math.max(18,median(widths)*.7));if(rows.length<3||columns.length<3||columns.length>18)return[];const rb=[0,...rows.slice(1).map((v,i)=>(rows[i]+v)/2),height],cb=[0,...columns.slice(1).map((v,i)=>(columns[i]+v)/2),width],cells=[];for(let row=0;row<rb.length-1;row++)for(let column=0;column<cb.length-1;column++)cells.push({id:`borderless-1-r${row}-c${column}`,tableId:"borderless-1",row,column,rowSpan:1,columnSpan:1,x:cb[column],y:rb[row],width:cb[column+1]-cb[column],height:rb[row+1]-rb[row]});return cells}
function placement(ocr,cells){let scored=0,correct=0;for(const item of ocr){if(item.expectedRow==null||item.expectedColumn==null)continue;const b=bounds(item.box),x=b.x+b.width/2,y=b.y+b.height/2,cell=cells.find(c=>c.x<=x&&x<=c.x+c.width&&c.y<=y&&y<=c.y+c.height);scored++;if(cell&&cell.row===item.expectedRow&&cell.column===item.expectedColumn)correct++}return scored?correct/scored:null}
function workerRun(bitmap){return new Promise((resolve,reject)=>{const worker=new Worker('/opencv-worker.js'),requestId=crypto.randomUUID(),started=performance.now();worker.onmessage=(event)=>{const message=event.data;if(message.requestId!==requestId)return;if(message.type==='error'){worker.terminate();reject(new Error(message.error))}if(message.type==='result'){worker.terminate();resolve({result:message.result,ms:performance.now()-started})}};worker.onerror=(event)=>reject(new Error(event.message));worker.postMessage({type:'analyze',requestId,imageBitmap:bitmap,opencvUrl:'/vendor/opencv.js'},[bitmap])})}
(async()=>{const cases=[];let maxLag=0,last=performance.now();const timer=setInterval(()=>{const now=performance.now();maxLag=Math.max(maxLag,now-last-25);last=now},25);const heapBefore=performance.memory?.usedJSHeapSize??null;try{for(const name of names){const [blob,expected]=await Promise.all([fetch(`/benchmark-fixtures/${name}.png`).then(r=>r.blob()),fetch(`/benchmark-fixtures/${name}.json`).then(r=>r.json())]);const runs=[];let geometry;for(let i=0;i<3;i++){const bitmap=await createImageBitmap(blob);const measured=await workerRun(bitmap);runs.push(measured.ms);geometry=measured.result}let cells=geometry.cell_rectangles;if(!cells.length&&expected.ocrBoxes?.length)cells=borderless(expected.ocrBoxes,geometry.page_transform.targetWidth,geometry.page_transform.targetHeight);const rows=Math.max(0,...cells.map(c=>c.row+(c.rowSpan||1))),columns=Math.max(0,...cells.map(c=>c.column+(c.columnSpan||1))),cellPlacement=placement(expected.ocrBoxes||[],cells);cases.push({fixture:`${name}.png`,kind:expected.kind,imageBytes:blob.size,coldOrFirstRunMs:+runs[0].toFixed(2),warmMedianMs:+median(runs.slice(1)).toFixed(2),rowAccuracy:+countAccuracy(expected.rows,rows).toFixed(4),columnAccuracy:+countAccuracy(expected.columns,columns).toFixed(4),cellCountAccuracy:+countAccuracy(expected.cellCount,cells.length).toFixed(4),cellPlacementAccuracy:cellPlacement==null?null:+cellPlacement.toFixed(4),blankCellAccuracy:cells.length===expected.cellCount?1:+countAccuracy(expected.cellCount,cells.length).toFixed(4),detectedRows:rows,detectedColumns:columns,detectedCells:cells.length,diagnostics:geometry.diagnostics})}clearInterval(timer);const placements=cases.map(c=>c.cellPlacementAccuracy).filter(v=>v!=null);const result={candidate:'A - Browser OpenCV.js geometry plus Vercel OCR',cases,summary:{medianWarmMs:+median(cases.map(c=>c.warmMedianMs)).toFixed(2),meanRowAccuracy:+(cases.reduce((s,c)=>s+c.rowAccuracy,0)/cases.length).toFixed(4),meanColumnAccuracy:+(cases.reduce((s,c)=>s+c.columnAccuracy,0)/cases.length).toFixed(4),meanCellCountAccuracy:+(cases.reduce((s,c)=>s+c.cellCountAccuracy,0)/cases.length).toFixed(4),meanCellPlacementAccuracy:placements.length?+(placements.reduce((s,v)=>s+v,0)/placements.length).toFixed(4):null,meanBlankCellAccuracy:+(cases.reduce((s,c)=>s+c.blankCellAccuracy,0)/cases.length).toFixed(4),maxMainThreadLagMs:+maxLag.toFixed(2),heapDeltaBytes:heapBefore==null?null:(performance.memory.usedJSHeapSize-heapBefore)},acceptance:{structureAccuracyPassed:cases.every(c=>c.rowAccuracy>=.9&&c.columnAccuracy>=.9&&c.cellCountAccuracy>=.9),blankCellsPassed:cases.every(c=>c.blankCellAccuracy===1),placementPassed:placements.every(v=>v>=.95),responsivenessPassed:maxLag<150}};window.__BENCHMARK_RESULT__=result;document.getElementById('output').textContent=JSON.stringify(result,null,2)}catch(error){clearInterval(timer);window.__BENCHMARK_RESULT__={error:error instanceof Error?error.message:String(error)};document.getElementById('output').textContent=JSON.stringify(window.__BENCHMARK_RESULT__,null,2)}})();
</script></body></html>
